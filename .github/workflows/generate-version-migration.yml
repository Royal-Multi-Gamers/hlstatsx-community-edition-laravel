name: Generate Version Migration

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  create-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate migration filename
        id: filename
        run: |
          DATE=$(date -u +"%Y_%m_%d_%H%M%S")
          SLUG=$(echo "${{ steps.version.outputs.version }}" | tr '.' '_')
          FILENAME="${DATE}_set_app_version_${SLUG}.php"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Filename: $FILENAME"

      - name: Create migration file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FILENAME="${{ steps.filename.outputs.filename }}"
          cat > "database/migrations/${FILENAME}" << 'MIGRATION'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Support\Facades\DB;

          /**
           * The legacy Perl daemon overwrites the `version` key in hlstats_Options
           * at every startup with its own hardcoded value. Laravel tracks the
           * webapp version under a dedicated `webapp_version` key instead.
           */
          return new class extends Migration
          {
              public function up(): void
              {
                  DB::table('hlstats_Options')
                      ->updateOrInsert(
                          ['keyname' => 'webapp_version'],
                          ['value' => 'VERSION_PLACEHOLDER', 'opttype' => 1]
                      );
              }

              public function down(): void {}
          };
          MIGRATION
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" "database/migrations/${FILENAME}"

      - name: Commit and push migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "database/migrations/${{ steps.filename.outputs.filename }}"
          git commit -m "chore: add version migration for v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.release.target_commitish }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Build release archive
        id: archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="hlstatsx-ce-v${VERSION}.zip"

          # Tracked files only, honouring export-ignore in .gitattributes.
          # Whitelist by design: vendor, node_modules, .git and .env can never
          # leak into the archive.
          git archive --format=zip --output="${ARCHIVE}" HEAD

          # Compiled assets are gitignored, so append them after the fact.
          zip -r "${ARCHIVE}" public/build

          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          ls -lh "${ARCHIVE}"

      - name: Upload archive to release
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          ARCHIVE="${{ steps.archive.outputs.archive }}"

          # Remove any leftover asset first: --clobber can fail with HTTP 500
          # when a previous upload left the asset in a broken state.
          gh release delete-asset "${TAG}" "${ARCHIVE}" --yes || true

          for attempt in 1 2 3 4 5; do
            echo "Upload attempt ${attempt} started at $(date -u +%T) ($(du -h "${ARCHIVE}" | cut -f1))"

            # gh prints nothing while transferring, so cap each attempt:
            # a stalled connection becomes a retry instead of a 6h job.
            if timeout 600 gh release upload "${TAG}" "${ARCHIVE}" --clobber; then
              echo "Upload succeeded at $(date -u +%T)"
              exit 0
            fi

            echo "Upload attempt ${attempt} failed, retrying in $((attempt * 15))s"
            gh release delete-asset "${TAG}" "${ARCHIVE}" --yes || true
            sleep $((attempt * 15))
          done

          echo "Upload failed after 5 attempts"
          exit 1
